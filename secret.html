<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀 메모장</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffe3ec 0%, #e3f0ff 50%, #eafff0 100%);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      padding: 24px 0;
      box-sizing: border-box;
    }

    .card {
      background: #fffafc;
      border-radius: 24px;
      padding: 36px 32px;
      box-shadow: 0 12px 30px rgba(200, 170, 200, 0.35);
      max-width: 380px;
      width: 90%;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #6b4c6b;
      margin: 0 0 4px;
      text-align: center;
    }

    .subtitle {
      font-size: 14px;
      color: #9a7ea3;
      text-align: center;
      margin: 0 0 24px;
    }

    form {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    form.stacked {
      flex-direction: column;
    }

    input {
      flex: 1;
      border: none;
      border-radius: 12px;
      background: #f6eef7;
      color: #6b4c6b;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      box-sizing: border-box;
    }

    input::placeholder {
      color: #c3a9c9;
    }

    button[type="submit"] {
      border: none;
      border-radius: 12px;
      background: #ffb6d9;
      color: #6b4c6b;
      font-weight: 700;
      font-size: 14px;
      padding: 10px 16px;
      cursor: pointer;
      white-space: nowrap;
    }

    button[type="submit"]:hover {
      background: #ff9fcc;
    }

    .lock-message {
      min-height: 18px;
      color: #e0668c;
      font-size: 13px;
      text-align: center;
      margin: 0;
    }

    #memo-list {
      list-style: none;
      padding: 0;
      margin: 16px 0 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #memo-list li {
      background: #eaf6ff;
      color: #5b7a99;
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="card" id="setup-screen" style="display: none;">
    <h1>🔐 비밀번호 설정</h1>
    <p class="subtitle">처음 사용하시네요! 사용할 비밀번호를 직접 정해주세요</p>
    <form id="setup-form" class="stacked">
      <input type="password" id="setup-password" placeholder="새 비밀번호 (4자 이상)" autocomplete="new-password" minlength="4" required>
      <input type="password" id="setup-password-confirm" placeholder="비밀번호 확인" autocomplete="new-password" minlength="4" required>
      <button type="submit">설정하기</button>
    </form>
    <p class="lock-message" id="setup-message"></p>
  </div>

  <div class="card" id="lock-screen" style="display: none;">
    <h1>🔒 비밀 메모장</h1>
    <p class="subtitle">비밀번호를 입력하세요</p>
    <form id="lock-form">
      <input type="password" id="password-input" placeholder="비밀번호" autocomplete="current-password" required>
      <button type="submit">잠금 해제</button>
    </form>
    <p class="lock-message" id="lock-message"></p>
  </div>

  <div class="card" id="memo-screen" style="display: none;">
    <h1>📝 비밀 메모장</h1>
    <p class="subtitle">나만 보는 메모</p>
    <form id="memo-form">
      <input type="text" id="memo-input" placeholder="메모를 입력하세요">
      <button type="submit">추가</button>
    </form>
    <ul id="memo-list"></ul>
  </div>

  <script>
    const PASSWORD_HASH_KEY = 'secretMemoPasswordHash';

    async function hashText(text) {
      const data = new TextEncoder().encode(text);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(hashBuffer))
        .map((byte) => byte.toString(16).padStart(2, '0'))
        .join('');
    }

    const setupScreen = document.getElementById('setup-screen');
    const lockScreen = document.getElementById('lock-screen');
    const memoScreen = document.getElementById('memo-screen');

    function showMemoScreen() {
      setupScreen.style.display = 'none';
      lockScreen.style.display = 'none';
      memoScreen.style.display = 'block';
    }

    if (localStorage.getItem(PASSWORD_HASH_KEY)) {
      lockScreen.style.display = 'block';
    } else {
      setupScreen.style.display = 'block';
    }

    const setupForm = document.getElementById('setup-form');
    const setupPassword = document.getElementById('setup-password');
    const setupPasswordConfirm = document.getElementById('setup-password-confirm');
    const setupMessage = document.getElementById('setup-message');

    setupForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      if (setupPassword.value !== setupPasswordConfirm.value) {
        setupMessage.textContent = '비밀번호가 서로 일치하지 않습니다';
        return;
      }

      const hash = await hashText(setupPassword.value);
      localStorage.setItem(PASSWORD_HASH_KEY, hash);
      showMemoScreen();
    });

    const lockForm = document.getElementById('lock-form');
    const passwordInput = document.getElementById('password-input');
    const lockMessage = document.getElementById('lock-message');

    lockForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      const enteredHash = await hashText(passwordInput.value);
      const storedHash = localStorage.getItem(PASSWORD_HASH_KEY);

      if (enteredHash === storedHash) {
        showMemoScreen();
      } else {
        lockMessage.textContent = '비밀번호가 틀렸습니다';
        passwordInput.value = '';
      }
    });

    const memoForm = document.getElementById('memo-form');
    const memoInput = document.getElementById('memo-input');
    const memoList = document.getElementById('memo-list');

    memoForm.addEventListener('submit', (event) => {
      event.preventDefault();

      const text = memoInput.value.trim();
      if (!text) return;

      const li = document.createElement('li');
      li.textContent = text;
      memoList.appendChild(li);

      memoInput.value = '';
    });
  </script>
</body>
</html>
