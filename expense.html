<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미니 가계부 분석기</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffe3ec 0%, #e3f0ff 50%, #eafff0 100%);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      padding: 24px 0;
      box-sizing: border-box;
    }

    .card {
      background: #fffafc;
      border-radius: 24px;
      padding: 36px 32px;
      box-shadow: 0 12px 30px rgba(200, 170, 200, 0.35);
      max-width: 420px;
      width: 90%;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #6b4c6b;
      margin: 0 0 4px;
      text-align: center;
    }

    .subtitle {
      font-size: 14px;
      color: #9a7ea3;
      text-align: center;
      margin: 0 0 24px;
    }

    form {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    input {
      border: none;
      border-radius: 12px;
      background: #f6eef7;
      color: #6b4c6b;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      box-sizing: border-box;
    }

    input::placeholder {
      color: #c3a9c9;
    }

    input[name="name"] {
      flex: 1.4;
    }

    input[name="amount"] {
      flex: 1;
    }

    button[type="submit"] {
      border: none;
      border-radius: 12px;
      background: #bb8cff;
      color: #ffffff;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.02em;
      padding: 10px 22px;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 4px 14px rgba(187, 140, 255, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    button[type="submit"]:hover {
      background: #ac74ff;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(172, 116, 255, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.45);
    }

    button[type="submit"]:active {
      transform: translateY(0) scale(0.97);
      box-shadow: 0 2px 6px rgba(187, 140, 255, 0.45);
    }

    button[type="submit"]:focus-visible {
      outline: 2px solid #bb8cff;
      outline-offset: 2px;
    }

    .list {
      list-style: none;
      padding: 0;
      margin: 0 0 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 260px;
      overflow-y: auto;
    }

    .list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #eaf6ff;
      color: #5b7a99;
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      gap: 8px;
    }

    .list .item-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .list .item-amount {
      white-space: nowrap;
    }

    .list .delete-btn {
      border: none;
      background: #ffffff;
      color: #bb8cff;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(187, 140, 255, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, color 0.15s ease;
    }

    .list .delete-btn:hover {
      background: #bb8cff;
      color: #ffffff;
      transform: scale(1.12) rotate(90deg);
      box-shadow: 0 4px 10px rgba(187, 140, 255, 0.5);
    }

    .list .delete-btn:active {
      transform: scale(0.95) rotate(90deg);
    }

    .list .delete-btn:focus-visible {
      outline: 2px solid #bb8cff;
      outline-offset: 2px;
    }

    .empty {
      text-align: center;
      color: #a98fb0;
      font-size: 14px;
      padding: 24px 16px;
      background: #f6eef7;
      border: 1.5px dashed #d8c2e0;
      border-radius: 12px;
    }

    .total {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff3d6;
      color: #a3854a;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>미니 가계부 분석기</h1>
    <p class="subtitle">오늘 쓴 돈, 가볍게 기록해 보세요 🌷</p>

    <form id="expense-form">
      <input type="text" name="name" placeholder="항목명 (예: 커피)" required maxlength="30">
      <input type="number" name="amount" placeholder="금액" required min="0" step="1">
      <button type="submit">추가</button>
    </form>

    <ul class="list" id="expense-list"></ul>

    <div class="total">
      <span>합계</span>
      <span id="total-amount">0원</span>
    </div>
  </div>

  <script>
    const form = document.getElementById('expense-form');
    const list = document.getElementById('expense-list');
    const totalAmountEl = document.getElementById('total-amount');

    let expenses = [];

    function formatWon(amount) {
      return amount.toLocaleString('ko-KR') + '원';
    }

    function render() {
      list.innerHTML = '';

      if (expenses.length === 0) {
        const empty = document.createElement('li');
        empty.className = 'empty';
        empty.textContent = '아직 등록된 지출이 없어요. 첫 지출을 기록해 보세요 🧾';
        list.appendChild(empty);
      } else {
        expenses.forEach((expense) => {
          const li = document.createElement('li');

          const nameSpan = document.createElement('span');
          nameSpan.className = 'item-name';
          nameSpan.textContent = expense.name;

          const amountSpan = document.createElement('span');
          amountSpan.className = 'item-amount';
          amountSpan.textContent = formatWon(expense.amount);

          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'delete-btn';
          deleteBtn.type = 'button';
          deleteBtn.setAttribute('aria-label', `${expense.name} 삭제`);
          deleteBtn.textContent = '✕';
          deleteBtn.addEventListener('click', () => {
            expenses = expenses.filter((item) => item.id !== expense.id);
            render();
          });

          li.appendChild(nameSpan);
          li.appendChild(amountSpan);
          li.appendChild(deleteBtn);
          list.appendChild(li);
        });
      }

      const total = expenses.reduce((sum, item) => sum + item.amount, 0);
      totalAmountEl.textContent = formatWon(total);
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();

      const nameInput = form.elements['name'];
      const amountInput = form.elements['amount'];

      const name = nameInput.value.trim();
      const amount = Number(amountInput.value);

      if (!name || !Number.isFinite(amount) || amount < 0) {
        return;
      }

      expenses.push({ id: Date.now(), name, amount });
      form.reset();
      nameInput.focus();
      render();
    });

    render();
  </script>
</body>
</html>
