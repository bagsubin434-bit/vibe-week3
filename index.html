<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>박수빈 - 개발자 소개</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffe3ec 0%, #e3f0ff 50%, #eafff0 100%);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    .card {
      background: #fffafc;
      border-radius: 24px;
      padding: 40px 36px;
      box-shadow: 0 12px 30px rgba(200, 170, 200, 0.35);
      text-align: center;
      max-width: 360px;
      width: 90%;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #ffd6e8;
      background: #f5f5f5;
      margin-bottom: 16px;
    }

    .name {
      font-size: 24px;
      font-weight: 700;
      color: #6b4c6b;
      margin: 8px 0 4px;
    }

    .tagline {
      font-size: 15px;
      color: #7a6386;
      margin-bottom: 24px;
    }

    .favorites {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .favorites li {
      background: #eaf6ff;
      color: #5b7a99;
      border-radius: 14px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
    }

    .favorites li:nth-child(2) {
      background: #fff3d6;
      color: #a3854a;
    }

    .favorites li:nth-child(3) {
      background: #e6ffe9;
      color: #5a9a6a;
    }

    .mood {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid #f1e4f1;
    }

    .mood-label {
      font-size: 14px;
      color: #7a6386;
      margin: 0 0 12px;
    }

    .mood-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .mood-btn {
      border: none;
      border-radius: 12px;
      background: #bb8cff;
      color: #ffffff;
      font-size: 20px;
      padding: 10px 16px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(187, 140, 255, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .mood-btn:hover {
      background: #ac74ff;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(172, 116, 255, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.45);
    }

    .mood-btn:active {
      transform: translateY(0) scale(0.97);
      box-shadow: 0 2px 6px rgba(187, 140, 255, 0.45);
    }

    .mood-btn:focus-visible {
      outline: 2px solid #bb8cff;
      outline-offset: 2px;
    }

    .mood-message {
      min-height: 40px;
      margin: 14px 0 0;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
      color: #6b4c6b;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="avatar" alt="박수빈 프로필 사진" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Ccircle cx='60' cy='60' r='60' fill='%23ffe3ec'/%3E%3Ccircle cx='60' cy='48' r='22' fill='%23fff'/%3E%3Cpath d='M20 110c6-28 30-40 40-40s34 12 40 40' fill='%23fff'/%3E%3C/svg%3E">
    <div class="name">박수빈</div>
    <p class="tagline">코드와 커피를 좋아하는 개발자입니다 ☕</p>
    <ul class="favorites">
      <li>🎧 음악 듣기</li>
      <li>📚 책 읽기</li>
      <li>🌱 식물 키우기</li>
    </ul>
    <div class="mood">
      <p class="mood-label">오늘 하루는 어떠셨나요?</p>
      <div class="mood-buttons">
        <button type="button" class="mood-btn" data-mood="happy" aria-label="행복해요">😊</button>
        <button type="button" class="mood-btn" data-mood="tired" aria-label="피곤해요">😴</button>
        <button type="button" class="mood-btn" data-mood="stressed" aria-label="스트레스 받아요">😤</button>
      </div>
      <p class="mood-message" id="mood-message" aria-live="polite"></p>
    </div>
  </div>
  <script>
    const moodMessages = {
      happy: '오늘의 그 기분, 계속 이어가요! 🎉',
      tired: '오늘 정말 고생 많았어요. 잠깐이라도 쉬어가요 🌙',
      stressed: '잠시 심호흡 한 번, 금방 괜찮아질 거예요 🍃',
    };

    document.querySelectorAll('.mood-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.getElementById('mood-message').textContent = moodMessages[btn.dataset.mood];
      });
    });
  </script>
</body>
</html>
